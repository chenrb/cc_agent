[project]
name = "cc-agent"
version = "0.1.0"
description = "CC Agent: 基于 agentscope 的前后端分离智能体应用"
readme = "README.md"
authors = [
    { name = "chenrb", email = "crbxyx@foxmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agentscope[channel,full,models,service,storage-redis,storage-s3,storage-sql,tools,workspace]",
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
agentscope = { path = "./agentscope", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
