[project]
name = "cc-agent"
version = "0.1.0"
description = "CC Agent: 基于 agentscope 的前后端分离智能体应用"
readme = "README.md"
authors = [
    { name = "chenrb", email = "crbxyx@foxmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agentscope[channel,full,models,service,storage-redis,storage-s3,storage-sql,tools,workspace]",
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
agentscope = { path = "./agentscope", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# agentscope 为内嵌框架副本（依赖，非应用代码），整体排除
extend-exclude = ["agentscope"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长由 formatter 统一处理

[tool.ruff.lint.isort]
# backend 为本应用一等工作包；agentscope 视作第三方依赖（独立分组）
known-first-party = ["backend"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖在默认参数中调用 Depends/Header/Query 等，属正常用法，豁免 B008
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.format]
docstring-code-format = true
